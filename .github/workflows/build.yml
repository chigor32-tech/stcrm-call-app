name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK with Gradle
      run: |
        mkdir -p app/src/main/java/ru/stcrm/callrouter app/src/main/res/layout
        mv AndroidManifest.xml app/src/main/ || true
        mv MainActivity.java app/src/main/java/ru/stcrm/callrouter/ || true
        mv CallReceiver.java app/src/main/java/ru/stcrm/callrouter/ || true
        
        echo '<?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="24dp">
            <EditText
                android:id="@+id/editWebhookUrl"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:hint="Webhook URL" />
            <Button
                android:id="@+id/btnSave"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="Сохранить" />
        </LinearLayout>' > app/src/main/res/layout/activity_main.xml

        echo 'include(":app")' > settings.gradle
        echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:7.4.2" } }' > build.gradle
        echo 'apply plugin: "com.android.application"
        android {
            compileSdk 33
            defaultConfig { applicationId "ru.stcrm.callrouter"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" }
        }' > app/build.gradle

        chmod +x ./gradlew || true
        # Сборка через Gradle
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
