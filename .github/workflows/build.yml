name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile App
      run: |
        mkdir -p app/src/main/java/ru/stcrm/callrouter app/src/main/res/layout gradle/wrapper
        
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/ru/stcrm/callrouter/ || true
        [ -f CallReceiver.java ] && mv CallReceiver.java app/src/main/java/ru/stcrm/callrouter/ || true

        echo '<?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:orientation="vertical" android:padding="24dp">
            <EditText android:id="@+id/editWebhookUrl" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Webhook URL"/>
            <Button android:id="@+id/btnSave" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Сохранить"/>
        </LinearLayout>' > app/src/main/res/layout/activity_main.xml

        echo 'pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        include(":app")
        rootProject.name = "StcrmRouter"' > settings.gradle

        echo 'plugins { id "com.android.application" version "7.4.2" apply false }' > build.gradle

        echo 'plugins { id "com.android.application" }
        android {
            compileSdk 33
            defaultConfig {
                applicationId "ru.stcrm.callrouter"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }' > app/build.gradle

        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Создаем правильные свойства обертки Gradle 7.5 напрямую
        echo "distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties

        # Скачиваем gradle-wrapper.jar и собираем проект
        curl -s -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v7.5.0/subprojects/wrapper/src/main/resources/gradle-wrapper.jar
        chmod +x ./gradlew || true

        # Запуск сборки через локальную обертку Gradle 7.5
        java -jar gradle/wrapper/gradle-wrapper.jar assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stcrm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
